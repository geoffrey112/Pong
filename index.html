<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="icon/favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <title>Retro Ping-Pong</title>
</head>
<body>

  <h1>Retro Ping-Pong</h1>

  <div class="contentCard">
    <div class="card1">
      <div class="face front1">
        <h2>J1</h2>
        <input type="text" name="j1" id="j1" maxlength="18">
      </div>
      <div class="face left"></div>
      <div class="face bottom1"></div>
    </div>

    <div class="card2">
      <div class="face front2">
        <h2>J2</h2>
        <input type="text" name="j2" id="j2" maxlength="18">
      </div>
      <div class="face right"></div>
      <div class="face bottom2"></div>
    </div>
  </div>

  <div class="contentError">
    <span id="errorMsg"></span>
  </div>

  <div class="buttonStart" tabindex="0">
    <span class="txtBtnStart">Start Game</span>
  </div>
    
  
  <div class="buttonKey" tabindex="0">
    <div id="containerKey">
      <span>Key</span>
      <div id="iconKey"></div>
    </div>
  </div>
 

  
  <script type="text/javascript" src="script.js"></script>
  <script type="text/javascript" src="game.js"></script>
</body>
</html>
